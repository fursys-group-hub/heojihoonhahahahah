<title>대전둔산 컬렉티브 세일즈톡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">

<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --ink: #18181b;
    --ink-soft: #71717a;
    --line: #e4e4e7;
    --accent: #3f7d54;
    --accent-2: #b5652b;
    --danger: #c0392b;

    --brand-desker: #4c74a6;
    --brand-iloom: #3f7d54;
    --brand-slowbed: #8a5b81;
    --brand-alloso: #b5652b;
    --brand-cidiz: #a1811f;
    --brand-default: #71717a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f10;
      --surface: #19191b;
      --surface-2: #212124;
      --ink: #f4f4f5;
      --ink-soft: #a1a1aa;
      --line: #2c2c30;
      --accent: #7fd39a;
      --accent-2: #d98a52;
      --danger: #e0917e;

      --brand-desker: #8fa9c4;
      --brand-iloom: #7fd39a;
      --brand-slowbed: #c298b8;
      --brand-alloso: #d98a52;
      --brand-cidiz: #d4b463;
      --brand-default: #9a9b8f;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f0f10;
    --surface: #19191b;
    --surface-2: #212124;
    --ink: #f4f4f5;
    --ink-soft: #a1a1aa;
    --line: #2c2c30;
    --accent: #7fd39a;
    --accent-2: #d98a52;
    --danger: #e0917e;

    --brand-desker: #8fa9c4;
    --brand-iloom: #7fd39a;
    --brand-slowbed: #c298b8;
    --brand-alloso: #d98a52;
    --brand-cidiz: #d4b463;
    --brand-default: #9a9b8f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }

  .wrap {
    margin: 0;
    padding: 0 24px 96px 56px;
  }

  header.masthead {
    padding: 6px 24px 10px 56px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px 64px; }
    header.masthead { padding: 12px 16px 10px; }
    .search-input { max-width: none; margin-left: 0; }
    .week-controls { gap: 8px; }
  }

  .masthead-inner {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .page {
    max-width: none;
  }

  .main-col {
    min-width: 0;
  }

  .ask-section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 20px;
  }

  .ask-form {
    display: flex;
    gap: 10px;
  }

  .ask-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 14px;
  }
  .ask-input::placeholder { color: var(--ink-soft); }
  .ask-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ask-btn {
    flex-shrink: 0;
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .ask-btn:hover:not(:disabled) { opacity: 0.85; }
  .ask-btn:disabled { opacity: 0.5; cursor: default; }
  .ask-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ask-answer:not(:empty) {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .ask-result {
    margin: 0;
    max-width: 780px;
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-line;
  }

  .ask-loading {
    margin: 0;
    font-size: 0.86rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .ask-error {
    margin: 0;
    font-size: 0.84rem;
    color: var(--danger);
  }

■ 슬로우베드(Slowbed): 프리미엄 매트리스 전문 브랜드. 매장 판매 매트리스는 전부 "MOON RAY" 컬렉션 소속이며, 폼 2종(Flow 19cm/Deep Flow 25cm)과 스프링 5종(Nook 17cm/Evening 28~33cm/Midnight 34cm/Starry Night 35cm/Twilight 39cm)으로 구성 — 두께·등급이 Nook<Evening<Midnight<Starry Night<Twilight 순으로 올라가는 구조(예산에 따른 업셀 동선으로 활용 가능). ※주의: "트와일라잇"은 독립 브랜드명이 아니라 MOON RAY 컬렉션 내 최상위 스프링 라인.
- 공통 핵심기술: 302H 스테인리스 포켓스프링(수저·의료기기급 소재, 부식 없음, 일반 강선보다 소재값 3~4배), 프로그레시브(와인잔형) 설계로 체중에 따라 지지력이 자동 조절, 100kg 하중 56만 회 수직압출시험 통과, 7존 조닝 설계(WAS 7존 시스템, S/M/H 포켓을 어깨·엉덩이·허리 등 부위별로 배치).
- 공통 인증·위생: 감마핵종분석기(HPGe)로 라돈·토론 등 방사성물질 8종 안전인증, 완제품 42가지 품질테스트, Sanitized(스위스/독일) 항균 커버·패딩, 그린가드 골드(VOCs 인증).
- Twilight(트와일라잇, 39cm, 최상위): 선셋(Soft)·선라이즈(Medium) 2종, 마이크로 포켓스프링으로 "2 STEP 체압분산 · 옆사람 움직임과 분리"(컴퓨터 키보드 자판 비유), 동반수면 최적화 컨셉, 6레이어 구조.
- Starry Night(스태리나잇, 35cm): 서울·제주 2종(Medium~Firm), 100% 호주산 장섬유 양모 사용(습기조절, 흡습성 면솜의 2배·화학솜의 40배), Oekotex Class1 인증.
- Midnight(미드나잇, 34cm): 뉴문(Medium Soft)·하프문(Medium)·풀문(Medium Firm) 3종 경도 — 같은 시리즈 안에서 경도를 고를 수 있어 "취향에 맞는 경도 선택"을 어필하기 좋음.
- Evening(이브닝, 28~33cm)·Nook(17cm): 분리형 커버(탈부착 세탁 가능), E-WAS 스테인리스 스프링, 실속형·저상형 라인.
- HALF MOON FROM MIDNIGHT(하프문 모션매트리스): 매트리스 자체에 전동 모션 내장(국내 최초 스프링 내장형 모션 매트리스), 세계 1위 덴마크 LINAK 모터(경쟁사는 LINAK을 벤치마킹해 중국에서 생산하는 오킨 모터 사용 — 원조 비교 화법 가능), 최대 각도 등·허리 67도·다리 39도, 4가지 프리셋(기본/숙면/피로회복/무중력), 8중 레이어, 34cm 유로탑으로 "모션 매트리스인데도 일반 프리미엄 매트리스 같은 포근함" 강조, 정품 인증 시 모터 5년 AS.
- 토퍼 3종: 올라운드(5·7cm)/그라운드(10cm)/맥시멈(THE NEW MAXIMUM, 11cm, 6단계 플로우커팅).
- 프레임 6종(아몬드/피칸/아티초크/아콘/피넛/엔다이브) 중 아몬드는 신제품 저상형 원목 프레임: 높이 5cm 초저상, 판재형 지지구조(시중 간살형 대비 부분 눌림·꺼짐 적음), 바닥에서 5cm 띄운 통기구조(습기·위생), E0등급 목재(포름알데히드 0.5mg/l, 업계 대부분 E1) — 나란히 배치하면 패밀리베드로 확장 가능.
■ 세일즈 화법 구조(Hook-Story-Offer): Hook은 고객이 공감할 질문으로 시작 → Story는 비교와 자랑(구체적 소재·기술 근거 포함) → Offer는 구체적 제안(사은품·서비스 등)으로 마무리.
■ 데스커(Desker): 스탠딩데스크·사무가구 전문 브랜드.
- 공통 소재: EO 등급 목재(포름알데히드 방출량 0.5mg/L 이하), 28mm 두께 상판 + 2mm ABS 엣지(시중 최고 수준 내구성), 세계 1위 독일 Schattdecor사 마감재 위 강화코팅 LPM.
- 고정형 데스크: 컴퓨터데스크2.0(배선트레이·캐스터, D600/700/800), 베이직데스크(군더더기 없는 실속형), 베이직데스크 이동형(브레이크 캐스터로 자유 배치), 멀티데스크(라운드 상판+A자형 다리, 협업용), 하부가림판데스크2.0(프라이버시 보호), 집중형데스크·집중형스테이션(몰입 업무용, IT기기 거치대·시야차단 스크린·LED 조명 3단계).
- 모션데스크(전동 높이조절) 라인업: 스마트(싱글모터, LINAK, 50kg 하중, 컴팩트·재택용), 플러스(싱글모터지만 양쪽 다리 기어박스 분산으로 편하중에 강함, 블루투스 앱 연동), 알파(듀얼모터 JIECANG, 32mm/s 속도·45db 이하 저소음, 70kg 하중, 가성비형), 프리미엄(4단계 높이 저장, 조명형 옵션, 100kg 하중), 포레그(모터 4개, 최대 200kg·분포하중 220kg, 3중 충돌방지, 임원실·디자인 고관여층 타겟).
- 안전설계: 자이로스코프 센서+전류 감지로 충돌을 감지하는 2중 충돌방지시스템(포레그는 3중)과, 충돌 즉시 반대방향으로 되돌아가는 롤백(Roll-back) 기능.
- A/S 보증: 높이조절 모터 5년, 컨트롤박스 3년, 스위치·전원선 등 소모품 1년.
- 벽고정 정책: 전도 위험이 있는 제품은 "벽고정 필수/권장"으로 구분해 안내하며, 벽고정 없이 사용하다 발생한 전도사고·파손은 고객 귀책임을 사전 안내.
■ 알로소(Alloso): 소파·가죽가구 전문 브랜드. 대부분 Studio One 자체 디자인이며, 하이엔드 라인 다수가 해외 디자이너 협업(Claudio Bellini-보눔·케렌시아·디토·라임·베르디, Alessandro Mendini-뚜따·리가, Vincent Van Duysen-테푸이, Desormeaux Carrette Studio-엘머, Note Design Studio-디딤).
- 공통 부자재: 구조재 E0등급 Solid Wood+LVB/합판, 스위스 simalfa社 수성접착제, 이탈리아 Intes社 고탄성 웨빙밴드+S자스프링, 모션제품은 미국 L&P(Legatt&Platt) 메커니즘, 국내 생산(세모디자인/인퍼니처).
- 착좌감 5단계(SOFT~HARD)로 전 라인업 분류 — 고객 취향 매칭 화법에 활용: SOFT(홀리데이·에브리데이), MEDIUM-SOFT(사티·사티모션·사티큐브·비하르·밀로·레지나·미·클렉트), MEDIUM(보눔·로바·바드·스탠·디딤·라임·테오), MEDIUM-HARD(카포네·케렌시아·엘머·디토), HARD(베르디·뚜따).
- 카포네/카포네그랑: 하이백 스윙소파, 좌판 40K 고밀도폼(경도15) 130mm+캐시미론8oz 통스펀지 사양(레이어링·접착 없음). 그랑은 좌판 1.5배 확장.
- 레지나(신규): 하이스트백 소파, 전체 높이 1,015mm로 "시중 하이백 평균 900mm보다 높게" 설계해 목까지 지지, 러플(프릴) 쿠션보더로 우아한 인상, 좌방석 탈착식.
- 바드: 미니멀 스퀘어 소파(덴마크어로 '가치'), 3인/2인 싱글베드/2인 데이베드/오토만 모듈 구성, 40~50대 중대형 평형 타겟.
- 디딤(2026.2.25 신제품): 모듈형 라운지 소파(4모듈라운지·패밀리라운지·4인·3인·코너1인·암리스·오토만·소반테이블), 레더는 4인 이상 모듈부터만 운영.
- 클렉트: 코너·와이드코너·멀티모듈형 휴식 컨셉 소파, 오프라인 매장 전용(온라인 미판매), 패브릭 사양은 단종 예정.
- 로바: 원모터 리클라이너, 철재프레임+공인 모터·메커니즘, 100% 국내제작.
- 홀리데이/홀리데이미니: 구스 대체 친환경 '에어필 마이크로 다운', 미니는 메모리폼(35K, 50mm) 추가 — "타사 구름소파는 등쿠션 지지력이 없어 계속 재배치해야 한다"는 직접 비교 화법 가능.
- 에브리데이: 마이크로파이버100% 패드+서포트폼 이중 구조, 풀커버 체인지업.
- 보눔(베스트셀러): 스퀘어형+30K 이상 고밀도폼·메모리폼으로 소프트한 착좌감, 오픈베이스/풀베이스(모듈형) 선택.
- 사티/사티모션/사티큐브: 사티는 트리플레스트 컨셉 시그니처 1인 소파(글로벌 디자인 어워드 3관왕). 사티모션은 "세계 최초 디자인 리클라이너"(최대 170.6도, 국내제작). 사티큐브는 360도 프리스위블+전체 마감재 자유 선택 가능(라인업 중 예외).
- 케렌시아: 저상형 좌식 모듈소파, 2020 IDEA·2021 Design Award 수상.
- 밀로/스탠(엠비언트 시리즈): 밀로는 구스100% 패딩(호텔 침구용 40수 다운프루프 원단)+플로팅 설계(오픈베이스). 스탠은 유일하게 퍼니싱 테이블 결합 모듈+전용 크롬 철제다리.
- 엘머: 프랑스 디자이너 듀오 협업 허그체어(단 마감재 교체·세탁 불가).
- 라임: 1인 리클라이너, 투모터(등판·발판 별도 작동), 미국 L&P+LIMOSS 모터, 최대 하중 125kg.
- 사이드테이블·소품: 무브/페일리/레이어/바인/넬릭/도나(Studio One), 리가(Mendini), 케렌시아 테이블(Bellini). 펫 라인은 펫스텝·펫베드(Studio One).
- 리클라이너 공통 유의사항(로바·사티모션·라임): 발받침 하중 30~40kg 한도, 작동 중 마찰소음 발생 가능 — 사전 안내 필요.
- 마감재 등급 체계: 레더 3등급(에센셜-소프트프리모 / 프리미엄-볼테라·드리밍헤비·르아테 / 하이엔드-베지탄·단테·머테리얼), 패브릭 3등급(에센셜-노르딕·솔라 / 프리미엄-아크레·스칼렛·루소 / 디자인-부클레·릴레이트·라리오). 제품별로 선택 불가한 마감재가 다르게 지정되어 있어 판매 전 반드시 확인(사티큐브·엘머·모브는 전체 마감재 조합 가능한 예외).
- 르아테 vs 드리밍헤비(둘 다 "레더 프리미엄" 등급이지만 실제로는 공급 태너리가 다른 별개 소재): 드리밍헤비는 이탈리아 Montebello社 가죽, 르아테는 이탈리아 Finco社 가죽. 르아테는 "클래식하고 빈티지한 무드의 세미네추럴 레더로 시간이 지나며 자연스럽게 에이징되어 결이 드러나는 내추럴한 터치감"이 특징으로 명시되어 있음(드리밍헤비는 문서상 컬러 옵션 위주로만 소개되고 별도 질감 강조 문구는 없음). 같은 프리미엄 등급 안에서도 르아테가 상급 소재로 취급됨 — 화법 예시: "드리밍헤비와 르아테는 같은 프리미엄 등급이지만, 르아테는 이탈리아 Finco사의 세미네추럴 가죽으로 자연스러운 에이징감과 광택이 특징인 상급 소재입니다."
- 가격대: 소재 등급 순으로 상승(패브릭 에센셜 < 패브릭 프리미엄/디자인 < 레더 에센셜 < 레더 프리미엄(볼테라·드리밍헤비) < 레더 프리미엄(르아테) < 레더 하이엔드(베지탄·단테·머테리얼)) — 구체적 금액은 제품·사이즈·소재 조합별로 전부 다르고 수시로 개정되므로 절대 지어내지 말고 반드시 매장 최신 가격표로 안내.
- A/S: 기본 품질보증 최대 3년(하자 유형별 세부 기간은 별도 확인 필요), 고객 과실은 고객 부담 원칙, 매장 전시품은 교환·반품 불가. A/S센터 1577-1641, 주문·배송 고객센터 1588-1526. 마감재 샘플 무료 신청 가능(배송 7~14영업일). 프레임은 그대로 두고 커버만 새로 씌우는 리커버링 서비스도 별도 운영.
- 원목가구(소반·케렌시아 테이블): 옹이·갈라짐·수축팽창에 의한 변형은 하자가 아님을 사전 고지.
■ 시디즈(Sidiz): 오피스 체어 전문 브랜드. T시리즈(사무용 회전의자), GC PRO·GX(게이밍), 링고·아이블·트레보(학습), 리니에·뮤브·에가·버튼(라이트워크), 아띠·몰티(유아), 마네·플릿(다이닝) 등 전 생애주기 라인업 보유.
- T20(구명 탭플러스): 20~30만원대 입문형, T시리즈 중 유일하게 등판 각도 고정 가능, 고객 DIY 조립.
- T50: 2007년 출시 후 200만 대 이상 판매된 시디즈 대표 스테디셀러, S라인 등판+높이/깊이 조절 럼버서포트, 30~50만원대.
- T60: 인피니핏 헤드레스트(높이/깊이/각도 조절), 워터폴 팔걸이, 싱크 틸트(5단계, 최대 130도), 자사 좌판폼 중 가장 두꺼운 60T 울트라컴포트폼, 30~40만원대.
- T80: 글로벌 엔지니어와 6년 협업한 하이엔드 모델, 얼티밋 싱크 틸트, 천연가죽 옵션, 품질보증 15년(24.5.7 리뉴얼분부터), 50~100만원대.
- T90: 자사 최고급 플래그십(2023.12 출시), 파노라마 4D 팔걸이(최대 230도 회전), 특허 퍼펙트 피팅 럼버서포트(자동 조절), 100만원 이상.
- T50/T60은 경쟁사(듀오백/리바트/사이즈오브)보다 품질보증기간이 김(5년 vs 3년), 가격은 비슷하거나 저렴.
- T90 vs 스틸케이스·허먼밀러급 해외 프리미엄 브랜드: 시디즈 90만원대·15년보증 vs 경쟁사 200만원대·12년보증, 헤드레스트 기본제공(경쟁사는 추가구매), 럼버서포트 자동조절, 팔걸이 최대 230도 회전 등 스펙 우위.
- 매장 연계 포인트: 데스커에서 파는 T20/T50/T60/T80/T90/GX/리니에/링고/아이블/에가/버튼/펑거스는 시디즈와 동일 제품(하부사양·마감재만 차이)이며, 일룸 아이핏=T50/지엘=T80/올리버=리니에/링고아이=링고/아띠아이=아띠/세타플러스=마네 대응 — "매장 여러 브랜드 의자, 알고보면 시디즈 기술"이라는 크로스 세일즈 화법 가능.
- 게이밍: GC PRO(프로게임단과 4년 협업한 시디즈 첫 프리미엄 게이밍의자, 등판LED+좌판쿨링시트 옵션, 품질보증 15년), GX(30~50만원 엔트리형, 듀얼텐션서포트 등판으로 별도 요추지지대 없이 허리 지지).
- 학습: 링고(국내 최초 4단계 그로잉+발받침으로 110~160cm 성장 커버, 스테디셀러), 아이블(독서실·도서관 의자의 원조, 앞바퀴+뒷글라이드로 불필요한 움직임 최소화, 신장 150~175cm 권장).
- 라이트워크: 리니에(체중을 자동 감지해 틸팅 강도를 맞추는 오토 핏 틸트, 컴팩트 사이즈, 30만원대), 뮤브(바퀴까지 통일된 알루미늄 플랫베이스, 심플 디자인).
- 다이닝: 마네(플라스틱/인조가죽 식탁의자), 플릿(9.9만원대 가성비, 부품 소재별 분리배출 설계).
- 유아: 아띠(18~40개월 책상의자 세트), 몰티(6개월~7세까지 커버하는 플로어시트+하이체어+책상의자).
- 공통 소재: 압축력을 극대화한 특허 '스쿠핑 성형 기법' 폼 좌판, 바닥재 손상을 최소화하는 우레탄 바퀴. 대부분 라인 품질보증 5년, T80·T90·GC PRO는 15년.
(데스커·시디즈·알로소는 위 스펙 범위 내에서 구체적으로 활용하되, 그 밖의 세부 가격·정책 정보는 지어내지 마세요.)`;

  // Textareas don't grow with their content by default, which forced an

  function autoGrowTextarea(el) {
    el.style.height = "auto";

  function weekSlug(week) {
    const digits = (week || "").replace(/\D+/g, "");
    if (digits) return digits;
    let h = 0;
    for (let i = 0; i < (week || "").length; i++) h = (h * 31 + week.charCodeAt(i)) | 0;
    return "w" + Math.abs(h);
  }

  function makeRowId(week, col) {
    return `${weekSlug(week)}__${col}`;
  }

  function buildWrittenSalesTalkContext() {

      (state.byWeek.get(week) || []).forEach((r) => {

  function buildAskPrompt(question) {

[답변 지침]

  function decodeBase64Utf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field); field = "";
      } else if (c === "\r") {
        // skip
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }

  const KNOWN_BRANDS = ["데스커", "일룸", "슬로우베드", "알로소", "시디즈"];
  const KNOWN_NAMES = ["이동현", "강예림", "최서영", "허지훈"];
  const WEEK_PATTERN = /\d{4}[.\-]\s?\d{2}[.\-]?\s?\d{0,2}\s*~\s*\d{0,4}[.\-]?\s?\d{2}[.\-]\s?\d{2}/;

  function looksLikeFlatTable(rows) {
    return rows.length > 0 && rows[0].some((c) => c.trim() === "주차");
  }

  const BRAND_ALIASES = { "슬로우배드": "슬로우베드" };

  function normalizeBrand(v) {
    return BRAND_ALIASES[v] || v;
  }

  function parseMatrix(rows) {
    let brandRowIdx = -1;
    let brandCols = {};
    for (let i = 0; i < rows.length; i++) {
      const cols = {};
      rows[i].forEach((c, idx) => {
        const v = normalizeBrand((c || "").trim());
        if (KNOWN_BRANDS.includes(v)) cols[idx] = v;
      });
      if (Object.keys(cols).length >= 3) { brandRowIdx = i; brandCols = cols; break; }
    }
    if (brandRowIdx === -1) return [];

    const topicRow = rows[brandRowIdx + 1] || [];
    const topics = {};
    Object.keys(brandCols).forEach((idx) => { topics[idx] = (topicRow[idx] || "").trim(); });

    let week = "";
    for (const r of rows) {
      for (const c of r) {
        const v = (c || "").trim();
        if (WEEK_PATTERN.test(v)) { week = v; break; }
      }
      if (week) break;
    }
    if (!week) week = "이번 주";

    // "공통" is a label written in the row above the brand-name row, marking
    // whichever column is that week's shared topic — not tied to a fixed
    // brand, so it's detected by the label rather than hardcoded to one.
    let commonIdx = null;
    for (let i = 0; i < brandRowIdx; i++) {
      const idx = (rows[i] || []).findIndex((c) => (c || "").trim() === "공통");
      if (idx !== -1) { commonIdx = String(idx); break; }
    }

    // Nobody is fixed to a brand — any of the team can fill in any column
    // in any given week — so collect every non-empty cell per column
    // instead of looking up one predetermined person per brand.
    const entriesByCol = {};
    Object.keys(brandCols).forEach((idx) => { entriesByCol[idx] = []; });

    for (let i = brandRowIdx + 2; i < rows.length; i++) {
      const row = rows[i];
      const nameCell = row.find((c) => KNOWN_NAMES.includes((c || "").trim()));
      if (!nameCell) continue;
      const name = nameCell.trim();
      Object.keys(brandCols).forEach((idx) => {
        const detail = (row[idx] || "").trim();
        if (detail) entriesByCol[idx].push({ name, detail });
      });
    }

    // Common topic always renders last, regardless of its column position in the sheet.
    const orderedIdxs = Object.keys(brandCols)
      .filter((idx) => idx !== commonIdx)
      .concat(commonIdx !== null ? [commonIdx] : []);

    return orderedIdxs.map((idx) => {
      const entries = entriesByCol[idx];
      const isCommon = idx === commonIdx;
      const brand = brandCols[idx];
      const topic = topics[idx] || "";

      if (!entries.length) {
        return {
          "주차": week, "담당자": isCommon ? "공통(전체)" : "미정", "브랜드": brand,
          "비교 주제": topic,
          "세부 내용": isCommon ? "아직 아무도 작성하지 않았어요." : "",
          "작성완료": "",
          __col: idx,
        };
      }

      const names = entries.map((e) => e.name);
      const done = isCommon ? KNOWN_NAMES.every((n) => names.includes(n)) : true;
      const detail = isCommon || entries.length > 1
        ? entries.map((e) => `${e.name}: ${e.detail}`).join("\n")
        : entries[0].detail;

      return {
        "주차": week,
        "담당자": isCommon ? "공통(전체)" : names.join(" · "),
        "브랜드": brand,
        "비교 주제": topic,
        "세부 내용": detail,
        "작성완료": done ? "완료" : "",
        __col: idx,
      };
    });
  }

  function toRecords(csvText) {
    const rows = parseCSV(csvText);
    if (!rows.length) return [];
    let records;
    if (looksLikeFlatTable(rows)) {
      const header = rows[0].map((h) => h.trim());
      const perWeekCounter = {};
      records = rows.slice(1).map((r) => {
        const obj = {};
        header.forEach((h, i) => { obj[h] = (r[i] || "").trim(); });
        const wk = obj["주차"] || "";
        perWeekCounter[wk] = (perWeekCounter[wk] ?? -1) + 1;
        obj.__col = String(perWeekCounter[wk]);
        return obj;
      });
    } else {
      records = parseMatrix(rows);
    }
    records.forEach((r) => { r.id = makeRowId(r["주차"], r.__col); });
    return records;
  }

  function weekStartValue(weekLabel) {
    const m = weekLabel.match(/(\d{4})\D{0,2}(\d{2})\D{0,1}(\d{2})/);
    if (!m) return 0;
    return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  }

  function formatWeekLabel(raw) {
    return raw.replace("~", " – ");
  }

  function isDone(val) {
    return /^(y|yes|완료|o|true|✔|✅)$/i.test((val || "").trim());
  }

  function brandInitial(brand) {
    return brand ? brand[0] : "?";
  }

  function isCommonRow(name) {
    return (name || "").includes("공통");
  }

  function matchesQuery(row, query) {
    if (!query) return true;
    return ["담당자", "브랜드", "비교 주제", "세부 내용"].some((key) =>
      (row[key] || "").toLowerCase().includes(query)
    );
  }

  const state = { weeks: [], byWeek: new Map(), currentIndex: 0, sheetCacheInfo: null, live: false, dbReady: false, query: "", brandFilter: null, refreshing: false, refreshError: false, mcpReady: false };
  const aiSummaries = new Map();
  let sampleFn = null;
  const saveTimers = new Map();
  const saveStatusEls = new Map();

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function setSaveStatus(key, status) {
    const el = saveStatusEls.get(key);
    if (!el) return;
    const label = { pending: "저장 대기중…", saving: "저장 중…", saved: "저장됨", error: "저장 실패, 다시 시도해주세요" }[status] || "";
    el.textContent = label;
    el.className = "edit-status" + (status === "error" ? " ai-error" : "");
  }

  function scheduleFieldSave(rowId, key, field, value) {
    setSaveStatus(key, "pending");
    const timerKey = key + ":" + field;
    clearTimeout(saveTimers.get(timerKey));
    const t = setTimeout(() => flushFieldSave(rowId, key, field, value), 900);
    saveTimers.set(timerKey, t);
  }

  async function flushFieldSave(rowId, key, field, value) {
    const timerKey = key + ":" + field;
    clearTimeout(saveTimers.get(timerKey));
    saveTimers.delete(timerKey);
    if (!dbApi) return;
    setSaveStatus(key, "saving");
    try {
      await dbApi.collection("rows").doc(rowId).update({ [field]: value });
      setSaveStatus(key, "saved");
    } catch (err) {
      setSaveStatus(key, "error");
    }
  }

  const AI_HIDE_CODES = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);
  const AI_ERROR_COPY = {
    rate_limited: "지금 요청이 많아요. 잠시 후 다시 시도해주세요.",

    refused: "이 요청은 생성할 수 없었어요.",
    empty_completion: "답변을 만들지 못했어요. 다시 시도해주세요.",
    prompt_too_large: "요청이 너무 커요. 잠시 후 다시 시도해주세요.",
    upstream_error: "일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요.",
  };

  function slotSelector(key) {
    return `.content-slot[data-key="${CSS.escape(key)}"]`;
  }
  function getSlotEl(key) {
    return grid.querySelector(slotSelector(key));
  }
  function memoSlotSelector(key) {
    return `.memo-slot[data-key="${CSS.escape(key)}"]`;
  }
  function getMemoSlotEl(key) {
    return grid.querySelector(memoSlotSelector(key));
  }

  const grid = document.getElementById("grid");
  const sectionLabel = document.getElementById("sectionLabel");
  const weekSelect = document.getElementById("weekSelect");
  const weekMeta = document.getElementById("weekMeta");
  const captionRow = document.getElementById("captionRow");
  const footNote = document.getElementById("footNote");
  const prevBtn = document.getElementById("prevWeek");
  const nextBtn = document.getElementById("nextWeek");
  const searchInput = document.getElementById("searchInput");
  const refreshBtn = document.getElementById("refreshBtn");
  const askSection = document.getElementById("askSection");
  const askForm = document.getElementById("askForm");
  const askInput = document.getElementById("askInput");
  const askBtn = document.getElementById("askBtn");
  const askAnswer = document.getElementById("askAnswer");
  let askController = null;

  function renderAskAvailability() {
    askSection.hidden = !sampleFn;
  }

  async function runAsk(question) {
    const q = question.trim();
    if (!sampleFn || !q) return;
    askController?.abort();
    askController = new AbortController();
    askBtn.disabled = true;
    askAnswer.innerHTML = `<p class="ask-loading">생각 중…</p>`;
    try {
      const { text } = await sampleFn(buildAskPrompt(q), {
        modelTier: "default",
        cache: false,
        signal: askController.signal,
        onText: ({ text }) => {
          let box = askAnswer.querySelector(".ask-result");
          if (!box) {
            askAnswer.innerHTML = `<p class="ask-result"></p>`;
            box = askAnswer.querySelector(".ask-result");
          }
          box.textContent = text;
        },
      });
      askAnswer.innerHTML = `
        <p class="ask-result"></p>
        <button type="button" class="ai-clear ask-clear">지우기</button>
      `;
      askAnswer.querySelector(".ask-result").textContent = text;
      askAnswer.querySelector(".ask-clear").addEventListener("click", () => {
        askAnswer.innerHTML = "";
      });
    } catch (e) {
      if (e.code === "cancelled") return;
      if (AI_HIDE_CODES.has(e.code)) {
        sampleFn = null;
        renderAskAvailability();
        return;
      }
      askAnswer.innerHTML = `<p class="ask-error">${AI_ERROR_COPY[e.code] || "일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요."}</p>`;
    } finally {
      askBtn.disabled = false;
    }
  }

  askForm.addEventListener("submit", (e) => {
    e.preventDefault();
    runAsk(askInput.value);
  });

  function isEditable() {
    return state.dbReady && !!dbApi;
  }

  function renderContentSlot(slot, r, key) {
    const editable = isEditable();
    if (!editable) {
      if (r["세부 내용"]) {
        slot.innerHTML = `<p class="brief">${escapeHtml(r["세부 내용"])}</p>`;
      } else {
        slot.innerHTML = `<p class="brief-empty">아직 작성 전이에요. (claude.ai에서 열면 바로 편집할 수 있어요)</p>`;
      }
      const aiHost = document.createElement("div");
      aiHost.className = "ai-suggestion-area";
      slot.appendChild(aiHost);
      renderAiSummaryArea(aiHost, r, key, editable);
      return;
    }

    slot.innerHTML = `
      <textarea class="brief-input" data-key="${key}" placeholder="세일즈톡 내용을 적어주세요…">${escapeHtml(r["세부 내용"] || "")}</textarea>
      <div class="edit-status" data-role="status"></div>
      <div class="ai-suggestion-area" data-role="ai"></div>
    `;
    saveStatusEls.set(key, slot.querySelector('[data-role="status"]'));
    const textarea = slot.querySelector(".brief-input");
    autoGrowTextarea(textarea);
    textarea.addEventListener("input", () => {
      autoGrowTextarea(textarea);
      scheduleFieldSave(r.id, key, "세부 내용", textarea.value);
    });
    textarea.addEventListener("blur", () => {
      flushFieldSave(r.id, key, "세부 내용", textarea.value);
    });
    renderAiSummaryArea(slot.querySelector('[data-role="ai"]'), r, key, editable);
  }

  // A small, separate field ("메모") next to each person's write-up, for
  // teammates to leave feedback — kept apart from "세부 내용" so a memo
  // never overwrites (or gets overwritten by) the sales talk itself.
  function renderMemoSlot(slot, r, key) {
    const editable = isEditable();
    const memo = r["메모"] || "";
    if (!editable) {
      slot.innerHTML = memo.trim()
        ? `<p class="memo-label">메모</p><p class="memo-view">${escapeHtml(memo)}</p>`
        : "";
      return;
    }
    const memoKey = key + "__memo";
    slot.innerHTML = `
      <p class="memo-label">메모</p>
      <textarea class="memo-input" data-key="${key}" placeholder="피드백을 남겨주세요…">${escapeHtml(memo)}</textarea>
      <div class="edit-status" data-role="memo-status"></div>
    `;
    saveStatusEls.set(memoKey, slot.querySelector('[data-role="memo-status"]'));
    const textarea = slot.querySelector(".memo-input");
    autoGrowTextarea(textarea);
    textarea.addEventListener("input", () => {
      autoGrowTextarea(textarea);
      scheduleFieldSave(r.id, memoKey, "메모", textarea.value);
    });
    textarea.addEventListener("blur", () => {
      flushFieldSave(r.id, memoKey, "메모", textarea.value);
    });
  }

  function renderAiSummaryArea(container, r, key, editable) {
    if (!container) return;
    const detail = (r["세부 내용"] || "").trim();
    const hasContent = detail && detail !== "아직 아무도 작성하지 않았어요.";
    if (!hasContent) {
      container.innerHTML = "";
      return;
    }
    const cached = aiSummaries.get(key);
    if (!cached) {
      container.innerHTML = sampleFn
        ? '<button type="button" class="ai-ask">✨ 핵심만 4문장으로 정리</button>'
        : "";
      const btn = container.querySelector(".ai-ask");
      if (btn) btn.addEventListener("click", () => runSummary(r, key));
      return;
    }
    if (cached.status === "loading") {
      container.innerHTML = `<p class="brief-empty ai-loading">Claude가 핵심을 정리하고 있어요…</p>`;
      return;
    }
    if (cached.status === "error") {
      container.innerHTML = `
        <p class="ai-error">${cached.message}</p>
        <button type="button" class="ai-ask">다시 시도</button>`;
      container.querySelector(".ai-ask").addEventListener("click", () => runSummary(r, key));
      return;
    }
    container.innerHTML = `
      <div class="ai-suggestion">
        <span class="ai-badge">✨ Claude 요약 · 검토 후 사용하세요</span>
        <p class="brief ai-text"></p>
        ${cached.status === "done" ? `
          <div class="ai-actions">
            ${editable ? '<button type="button" class="ai-use">이 요약 사용하기</button>' : ""}
            <button type="button" class="ai-retry">다시 정리</button>
            <button type="button" class="ai-clear">지우기</button>
          </div>` : ""}
      </div>`;
    container.querySelector(".ai-text").textContent = cached.text;
    const useBtn = container.querySelector(".ai-use");
    if (useBtn) useBtn.addEventListener("click", () => {
      const slot = getSlotEl(key);
      const textarea = slot && slot.querySelector(".brief-input");
      if (textarea) {
        textarea.value = cached.text;
        flushFieldSave(r.id, key, "세부 내용", cached.text);
      }
    });
    const retryBtn = container.querySelector(".ai-retry");
    if (retryBtn) retryBtn.addEventListener("click", () => runSummary(r, key, { force: true }));
    const clearBtn = container.querySelector(".ai-clear");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      aiSummaries.delete(key);
      renderAiSummaryArea(container, r, key, editable);
    });
  }

  function updateAiArea(key, r, editable) {
    const slot = getSlotEl(key);
    if (!slot) return;
    if (editable) {
      renderAiSummaryArea(slot.querySelector('[data-role="ai"]') || slot.querySelector(".ai-suggestion-area"), r, key, editable);
    } else {
      renderContentSlot(slot, r, key);
    }
  }

  async function runSummary(r, key, opts = {}) {
    if (!sampleFn) return;
    const editable = isEditable();
    aiSummaries.set(key, { status: "loading" });
    updateAiArea(key, r, editable);
    try {
      const { text } = await sampleFn(buildSummaryPrompt(r), {
        modelTier: "default",
        cache: opts.force ? false : { gcTime: 21600000 },
        onText: ({ text }) => {
          aiSummaries.set(key, { status: "streaming", text });
          updateAiArea(key, r, editable);
        },
      });
      aiSummaries.set(key, { status: "done", text });
      updateAiArea(key, r, editable);
    } catch (e) {
      if (e.code === "cancelled") { aiSummaries.delete(key); return; }
      if (AI_HIDE_CODES.has(e.code)) {
        sampleFn = null;
        aiSummaries.delete(key);
        renderAskAvailability();
        renderWeek();
        return;
      }
      aiSummaries.set(key, { status: "error", message: AI_ERROR_COPY[e.code] || "일시적인 오류가 발생했어요. 잠시 후 다시 시도해주세요." });
      updateAiArea(key, r, editable);
    }
  }

  function renderState(kind, message, linkHref) {
    sectionLabel.textContent = kind === "error" ? "문제 발생" : "안내";
    const linkHtml = linkHref
      ? ` <a href="${linkHref}" target="_blank" rel="noopener">시트에서 바로 보기 →</a>`
      : "";
    grid.innerHTML = `<div class="state-box ${kind === "error" ? "error" : ""}" style="grid-column:1/-1">${message}${linkHtml}</div>`;
  }

  function renderWeek() {
    const editable = isEditable();
    const prevFocused = document.activeElement;
    let restoreFocus = null;
    if (prevFocused && prevFocused.classList && (prevFocused.classList.contains("brief-input") || prevFocused.classList.contains("memo-input"))) {
      restoreFocus = {
        type: prevFocused.classList.contains("memo-input") ? "memo" : "content",
        key: prevFocused.dataset.key,
        value: prevFocused.value,
        selStart: prevFocused.selectionStart,
        selEnd: prevFocused.selectionEnd,
      };
    }

    const week = state.weeks[state.currentIndex];
    const allRows = state.byWeek.get(week) || [];
    const query = state.query.trim().toLowerCase();
    const rows = allRows.filter(
      (r) => matchesQuery(r, query) && (!state.brandFilter || r["브랜드"] === state.brandFilter)
    );
    weekSelect.value = week;
    prevBtn.disabled = state.currentIndex >= state.weeks.length - 1;
    nextBtn.disabled = state.currentIndex <= 0;
    const doneCount = allRows.filter((r) => isDone(r["작성완료"])).length;
    weekMeta.innerHTML = `브랜드 ${allRows.length}개 · <span class="progress-pill">작성완료 ${doneCount}/${allRows.length}</span>`;
    sectionLabel.textContent = editable ? "이번 주 세일즈톡 · 카드 내용을 눌러 바로 수정하세요" : "이번 주 세일즈톡";

    captionRow.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "caption-pill" + (!state.brandFilter ? " active" : "");
    allBtn.type = "button";
    allBtn.textContent = "전체";
    allBtn.setAttribute("aria-pressed", String(!state.brandFilter));
    allBtn.addEventListener("click", () => {
      state.brandFilter = null;
      renderWeek();
    });
    captionRow.appendChild(allBtn);

    allRows.forEach((r) => {
      const brand = r["브랜드"];
      const common = isCommonRow(r["담당자"]);
      const btn = document.createElement("button");
      btn.className = "caption-pill" + (state.brandFilter === brand ? " active" : "");
      btn.type = "button";
      btn.style.setProperty("--pill-c", brandVar(brand));
      btn.textContent = common ? "공통" : brand || "기타";
      btn.setAttribute("aria-pressed", String(state.brandFilter === brand));
      btn.addEventListener("click", () => {
        state.brandFilter = state.brandFilter === brand ? null : brand;
        renderWeek();
      });
      captionRow.appendChild(btn);
    });

    grid.innerHTML = "";
    if (!rows.length) {
      const labels = [query && `"${state.query.trim()}"`, state.brandFilter].filter(Boolean);
      const message = labels.length
        ? `${labels.join(" · ")}에 해당하는 세일즈톡이 없어요.`
        : "이번 주 세일즈톡이 없어요.";
      grid.innerHTML = `<div class="state-box" style="grid-column:1/-1">${message}</div>`;
    }
    rows.forEach((r) => {
      const common = isCommonRow(r["담당자"]);
      const card = document.createElement("article");
      card.className = "card" + (common ? " common" : "");
      card.style.setProperty("--brand", brandVar(r["브랜드"]));
      const done = isDone(r["작성완료"]);
      card.innerHTML = `
        <div class="card-top">
          <div class="avatar">${brandInitial(r["브랜드"])}</div>
          <div class="who">
            <h3>${r["브랜드"] || ""}</h3>
            <span class="tag">${common ? "전원 참여" : r["담당자"]}</span>
          </div>
        </div>
        <p class="matchup">${(r["비교 주제"] || "").replace(/\s*vs\s*/i, '<span class="vs">VS</span>')}</p>
        <div class="card-body">
          <div class="content-slot"></div>
          <div class="memo-slot"></div>
        </div>
        <div class="status-row"><button type="button" class="pill ${done ? "done" : ""}" data-role="done-toggle" ${editable ? "" : "disabled"}>${done ? "✓ 작성 완료" : "작성 예정"}</button></div>
      `;
      grid.appendChild(card);
      const key = rowKey(r);
      const slot = card.querySelector(".content-slot");
      slot.dataset.key = key;
      renderContentSlot(slot, r, key);
      const memoSlot = card.querySelector(".memo-slot");
      memoSlot.dataset.key = key;
      renderMemoSlot(memoSlot, r, key);

      const doneBtn = card.querySelector('[data-role="done-toggle"]');
      if (doneBtn && editable) {
        doneBtn.addEventListener("click", () => {
          const nextVal = isDone(r["작성완료"]) ? "" : "완료";
          doneBtn.textContent = nextVal ? "✓ 작성 완료" : "작성 예정";
          doneBtn.classList.toggle("done", !!nextVal);
          dbApi.collection("rows").doc(r.id).update({ "작성완료": nextVal }).catch(() => {
            doneBtn.textContent = isDone(r["작성완료"]) ? "✓ 작성 완료" : "작성 예정";
            doneBtn.classList.toggle("done", isDone(r["작성완료"]));
          });
        });
      }
    });

    if (restoreFocus) {
      const slot = restoreFocus.type === "memo" ? getMemoSlotEl(restoreFocus.key) : getSlotEl(restoreFocus.key);
      const ta = slot && slot.querySelector(restoreFocus.type === "memo" ? ".memo-input" : ".brief-input");
      if (ta) {
        ta.value = restoreFocus.value;
        autoGrowTextarea(ta);
        ta.focus();
        try { ta.setSelectionRange(restoreFocus.selStart, restoreFocus.selEnd); } catch {}
      }
    }

    if (state.refreshing) {
      footNote.textContent = "시트에서 가져오는 중…";
    } else if (state.refreshError) {
      footNote.textContent = "가져오기 실패, 잠시 후 다시 시도해주세요.";
    } else if (editable) {
      footNote.textContent = state.sheetCacheInfo && state.sheetCacheInfo.storedAt
        ? `실시간 협업 편집 중 · 시트 마지막 동기화: ${new Date(state.sheetCacheInfo.storedAt).toLocaleString("ko-KR")}`
        : "실시간 협업 편집 중 · 카드에서 바로 수정하면 모두에게 즉시 반영돼요";
    } else {
      footNote.textContent = SYNCED_LABEL + " (읽기 전용 미리보기)";
    }
    refreshBtn.disabled = !state.mcpReady || state.refreshing;
    refreshBtn.title = state.mcpReady
      ? ""
      : "이 화면에서는 구글시트 자동 가져오기를 쓸 수 없어요. 카드 내용은 계속 실시간으로 편집·공유돼요.";
  }

  function applyRows(records, live) {
    state.live = !!live;
    const byWeek = new Map();
    records.forEach((r) => {
      const key = r["주차"];
      if (!key) return;
      if (!byWeek.has(key)) byWeek.set(key, []);
      byWeek.get(key).push(r);
    });
    // db returns rows in document-id order, which doesn't know that a
    // "common" row should always render last — restore that convention
    // here regardless of where the source (sheet column, db doc id)
    // happened to place it.
    byWeek.forEach((arr) => {
      arr.sort((a, b) => (isCommonRow(a["담당자"]) ? 1 : 0) - (isCommonRow(b["담당자"]) ? 1 : 0));
    });

    const weeks = [...byWeek.keys()].sort((a, b) => weekStartValue(b) - weekStartValue(a));
    state.weeks = weeks;
    state.byWeek = byWeek;
    state.currentIndex = Math.min(state.currentIndex, Math.max(weeks.length - 1, 0));

    weekSelect.innerHTML = weeks
      .map((w) => `<option value="${w}">${formatWeekLabel(w)}</option>`)
      .join("");

    if (!weeks.length) {
      renderState("info", "아직 등록된 세일즈톡이 없어요.");
      return;
    }
    renderWeek();
  }

  weekSelect.addEventListener("change", () => {
    state.currentIndex = state.weeks.indexOf(weekSelect.value);
    renderWeek();
  });
  prevBtn.addEventListener("click", () => {
    if (state.currentIndex < state.weeks.length - 1) { state.currentIndex++; renderWeek(); }
  });
  nextBtn.addEventListener("click", () => {
    if (state.currentIndex > 0) { state.currentIndex--; renderWeek(); }
  });
  searchInput.addEventListener("input", () => {
    state.query = searchInput.value;
    renderWeek();
  });

  const SHEET_LINK = `https://docs.google.com/spreadsheets/d/${SHEET_FILE_ID}/edit`;
  let dbApi = null;

  // Merge (non-destructive to existing content) a batch of parsed
  // records into the shared "rows" collection: creates rows that don't
  // exist yet (seeding their content too), and — unless seedOnly — keeps
  // structure fields (주차/브랜드/담당자/비교 주제) in sync on rows that
  // already exist, without ever touching their live-edited 세부 내용 /
  // 작성완료 fields.
  async function mergeRowsIntoDb(records, opts = {}) {
    if (!dbApi) return;
    const col = dbApi.collection("rows");
    for (const r of records) {
      if (!r.id) continue;
      const ref = col.doc(r.id);
      let snap;
      try {
        snap = await ref.get();
      } catch (err) {
        continue;
      }
      const structure = {
        "주차": r["주차"] || "",
        "브랜드": r["브랜드"] || "",
        "담당자": r["담당자"] || "",
        "비교 주제": r["비교 주제"] || "",
      };
      const hasRealContent = r["세부 내용"] && r["세부 내용"] !== "아직 아무도 작성하지 않았어요.";
      try {
        if (!snap.exists) {
          await ref.set({ ...structure, "세부 내용": r["세부 내용"] || "", "작성완료": r["작성완료"] || "" });
        } else if (!opts.seedOnly) {
          // The sheet is where the team actually writes content today, so a
          // sheet cell with real text in it always wins on import — an empty
          // sheet cell never blanks out content someone already wrote.
          if (hasRealContent) {
            structure["세부 내용"] = r["세부 내용"];
            structure["작성완료"] = r["작성완료"] || "";
          }
          await ref.update(structure);
        }
      } catch (err) {
        // best-effort; a future merge will retry this row
      }
    }
  }

  async function seedFromBaked() {
    try {
      const csvText = decodeBase64Utf8(BAKED_CSV_B64);
      await mergeRowsIntoDb(toRecords(csvText), { seedOnly: true });
    } catch (err) {
      // ignore seed failures; the local baked render still works
    }
  }

  // db is the primary, real-time, collaboratively-editable source of
  // truth: every viewer who can open this page reads and writes the
  // same "rows" collection, so edits appear for everyone live with no
  // refresh needed. Falls back to the read-only baked snapshot when db
  // isn't available in this view (e.g. outside claude.ai).
  async function initDb() {
    if (!("claude" in window)) return;
    try {
      dbApi = await window.claude.use("db");
    } catch {
      dbApi = null;
    }
    if (!dbApi) return;
    state.dbReady = true;
    seedFromBaked();
    dbApi.collection("rows").onSnapshot(
      (snap) => {
        const rows = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
        if (!rows.length) return; // nothing seeded yet; keep the baked render up
        applyRows(rows, true);
      },
      () => {
        // db unavailable for this viewer; keep last-good (baked) data
      }
    );
  }

  function renderBaked() {
    try {
      const csvText = decodeBase64Utf8(BAKED_CSV_B64);
      applyRows(toRecords(csvText), false);
    } catch (err) {
      renderState("error", "저장된 내용을 불러오는 중 오류가 났어요.", SHEET_LINK);
    }
  }

  // Optional, manual sync: whoever has the Google Sheet connector can
  // pull the current week's sheet into the shared db (merged, never
  // overwriting anyone's already-written content). Not required for
  // normal use — editing happens directly on the cards.
  async function tryLiveEnhance() {
    if (!("claude" in window)) return;
    const mcp = await window.claude.use("mcp").catch(() => null);
    if (!mcp) return;

    let server;
    try {
      const { servers } = await mcp.listTools();
      const match = servers.find((s) => s.tools.some((t) => t.name === REQUIRED_TOOL));
      if (!match) return;
      server = match.server;
    } catch (err) {
      return;
    }

    const sheetInput = { fileId: SHEET_FILE_ID, exportMimeType: "text/csv" };

    mcp.watchTool(
      server,
      REQUIRED_TOOL,
      sheetInput,
      (ev) => {
        if (ev.type === "error") {
          // A manual "가져오기" that fails gets a visible (temporary) note;
          // background polling failures stay silent and keep last-good data.
          if (state.refreshing) {
            state.refreshing = false;
            state.refreshError = true;
            renderWeek();
            setTimeout(() => {
              state.refreshError = false;
              renderWeek();
            }, 4000);
          }
          return;
        }
        try {
          const payload = ev.result.payload;
          const b64 = typeof payload === "string" ? payload : payload && payload.content;
          if (!b64) return;
          const csvText = decodeBase64Utf8(b64);
          const records = toRecords(csvText);
          state.refreshing = false;
          state.refreshError = false;
          state.sheetCacheInfo = ev.result.cache || null;
          if (!dbApi) applyRows(records, false);
          mergeRowsIntoDb(records, { seedOnly: false }).catch(() => {
            // this viewer still sees the sheet locally even if sharing it failed
          });
        } catch (err) {
          // ignore malformed live payloads, keep last-good data
        }
      },
      { refetchInterval: 60000 }
    );

    state.mcpReady = true;
    refreshBtn.disabled = state.refreshing;
    refreshBtn.addEventListener("click", () => {
      if (state.refreshing) return;
      state.refreshing = true;
      state.refreshError = false;
      renderWeek();
      mcp.invalidate(server, REQUIRED_TOOL, sheetInput).catch(() => {
        // invalidate itself failing just means nothing was cached;
        // the watch handler above still settles the refreshing state.
      });
    });
  }

  // Best-effort: lights up the "핵심만 4문장으로 정리" button on entries that
  // already have written content, where the sample capability actually
  // resolves; silently absent otherwise.
  async function initSample() {
    if (!("claude" in window)) return;
    try {
      sampleFn = await window.claude.use("sample");
    } catch {
      sampleFn = null;
    }
    renderAskAvailability();
    if (sampleFn && state.weeks.length) renderWeek();
  }

  renderBaked();
  initDb();
  tryLiveEnhance();
  initSample();
</script>
